name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff==0.14.0
      - run: ruff check main.py src/ tests/

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The system python3 is used on purpose: PyGObject and the NM typelib
      # come from apt and are not visible to a setup-python interpreter.
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          python3-gi python3-cairo python3-venv
          gir1.2-adw-1 gir1.2-gtk-4.0 gir1.2-nm-1.0 lua5.4
      - run: python3 -m venv --system-site-packages .venv
      - run: .venv/bin/pip install --quiet maturin==1.9.6
      - run: .venv/bin/maturin develop --manifest-path rust/caelestia-py/Cargo.toml --locked
      - run: .venv/bin/python -m unittest discover -s tests -v
      - name: Extension import and application construction smoke test
        run: >-
          .venv/bin/python -c
          'import caelestia_core; from main import SettingsApp; app = SettingsApp(); assert app is not None'

  lint-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test-rust:
    runs-on: ubuntu-latest
    needs: lint-rust
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --locked --workspace

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
