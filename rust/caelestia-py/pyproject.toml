[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "caelestia-core"
version = "0.1.0"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# Determines the importable name (`import caelestia_core`), independent
# of the Cargo package name ("caelestia-py") and the crate's own
# `--crate-name` ("caelestia_py") — see the `#[pyo3(name = ...)]` note
# in src/lib.rs for why those two had to stay different from this.
module-name = "caelestia_core"
features = ["pyo3/extension-module"]
